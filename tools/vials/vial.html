<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>html,body{margin:0;overflow:hidden;background:#e9edf1}canvas{display:block}</style>
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js",
               "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
</head><body>
<script type="module">
// Studio product shot of one catalog vial — same sleek vial and lighting as the live home-page hero (js/hero3d.js).
// window.renderVial({ name, option, lot }) draws the label and renders one frame.
import * as THREE from 'three';
import { makeVial, studioEnvironment, FONTS, LOGO } from './js/vial-model.js';

const W = innerWidth, H = innerHeight;

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.95;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.VSMShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.environment = studioEnvironment(renderer, 0x1e2226, 1.6);

// ---- the set: a glossy pale tabletop running back to a grey wall. The table edge sits just above the vial's
// foot, which is what reads as depth; the wall is darker than the table, lit from the upper left.
const canvasTex = (w, h, paint) => {
  const c = document.createElement('canvas'); c.width = w; c.height = h; paint(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
};
const linear = (x, y0, y1, stops) => { const g = x.createLinearGradient(0, y0, 0, y1); stops.forEach(([o, c]) => g.addColorStop(o, c)); return g; };
const TABLE_BACK = -4, TABLE_FRONT = 10;
scene.background = new THREE.Color(0xf1f3f5); // what the semi-transparent tabletop sits over where there's no reflection
// tabletop, back edge at the top of the texture: bright in front, greying toward the edge
const tableTex = canvasTex(8, 1024, (x, w, h) => {
  x.fillStyle = linear(x, 0, h, [[0, '#cfd4d9'], [0.04, '#dde1e5'], [0.3, '#e9ecef'], [1, '#f3f5f7']]); x.fillRect(0, 0, w, h);
});
// the table is partly see-through so the vial's mirror image shows in the gloss, strongest at its foot
const reflectTex = canvasTex(8, 1024, (x, w, h) => {
  x.fillStyle = linear(x, 0, h, [[0, '#8c8c8c'], [0.3, '#8c8c8c'], [0.45, '#b4b4b4'], [0.62, '#e6e6e6'], [0.72, '#ffffff']]); x.fillRect(0, 0, w, h);
});
reflectTex.colorSpace = THREE.NoColorSpace;
const table = new THREE.Mesh(new THREE.PlaneGeometry(30, TABLE_FRONT - TABLE_BACK),
  new THREE.MeshBasicMaterial({ map: tableTex, alphaMap: reflectTex, transparent: true, depthWrite: false, toneMapped: false }));
table.rotation.x = -Math.PI / 2; table.position.set(0, 0, (TABLE_FRONT + TABLE_BACK) / 2); table.renderOrder = 1; scene.add(table);
// wall: darker at the table line, lifting toward a soft light pool upper left
const wallTex = canvasTex(1024, 1024, (x, w, h) => {
  x.fillStyle = linear(x, h, 0, [[0, '#b9bfc5'], [0.06, '#c8cdd2'], [0.5, '#d3d7db'], [1, '#d9dce0']]); x.fillRect(0, 0, w, h);
  const r = x.createRadialGradient(w * 0.32, h * 0.25, 0, w * 0.32, h * 0.25, w * 0.6);
  r.addColorStop(0, 'rgba(255,255,255,.35)'); r.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = r; x.fillRect(0, 0, w, h);
});
const wall = new THREE.Mesh(new THREE.PlaneGeometry(30, 16), new THREE.MeshBasicMaterial({ map: wallTex, toneMapped: false }));
wall.position.set(0, 8, TABLE_BACK); scene.add(wall);

const camera = new THREE.PerspectiveCamera(24, W / H, 0.1, 100);
camera.position.set(0, 3.2, 15.5); camera.lookAt(0, 2.15, 0);

// key from high overhead so the shadow pools under the vial instead of falling off to one side
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(-1, 12, 2.5);
key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 14; key.shadow.blurSamples = 24;
Object.assign(key.shadow.camera, { left: -4, right: 4, top: 6, bottom: -4 });
scene.add(key);
// ice-blue rim lights from behind pick out the glass and crimp edges
const rimL = new THREE.DirectionalLight(0xffd9a0, 3); rimL.position.set(-6, 4, -6); scene.add(rimL);
const rimR = new THREE.DirectionalLight(0xffd9a0, 2.2); rimR.position.set(6, 3, -6); scene.add(rimR);
const fill = new THREE.DirectionalLight(0xffffff, 0.6); fill.position.set(4, 2, 5); scene.add(fill);

const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, TABLE_FRONT - TABLE_BACK), new THREE.ShadowMaterial({ opacity: 0.16 }));
floor.rotation.x = -Math.PI / 2; floor.position.set(0, 0.001, (TABLE_FRONT + TABLE_BACK) / 2); floor.receiveShadow = true; floor.renderOrder = 2; scene.add(floor);
// soft contact shadow where the glass meets the set
const cs = document.createElement('canvas'); cs.width = cs.height = 256;
const csx = cs.getContext('2d'); const cg = csx.createRadialGradient(128, 128, 0, 128, 128, 128);
cg.addColorStop(0, 'rgba(20,28,38,.55)'); cg.addColorStop(0.45, 'rgba(20,28,38,.22)'); cg.addColorStop(1, 'rgba(20,28,38,0)');
csx.fillStyle = cg; csx.fillRect(0, 0, 256, 256);
const contact = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 1.5), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(cs), transparent: true, depthWrite: false }));
contact.rotation.x = -Math.PI / 2; contact.position.y = 0.003; contact.renderOrder = 3; scene.add(contact);

const vial = makeVial(window.MARK_PARTS, { sleek: true, glass: 'transmission' }); // MARK_PARTS injected by render.mjs from the site logo
scene.add(vial.group);
// mirror image under the table, seen through its gloss (shares the label texture, so it updates with drawLabel)
const mirror = vial.group.clone(); mirror.scale.y = -1;
mirror.traverse((o) => { o.castShadow = false; });
scene.add(mirror);

window.renderVial = (spec) => { vial.drawLabel(spec); renderer.render(scene, camera); };
await Promise.all([...FONTS.map((f) => document.fonts.load(f)), LOGO.decode()]);
window.READY = true;
</script>
</body></html>
